    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);

    function truncate(str, len) { len = len || 50; if (str.length <= len) return str; return str.slice(0, len) + "…"; }

    function extractWaveform(audioBuffer, numSamples) {
      numSamples = numSamples || WAVEFORM_SAMPLES;
      const ch = audioBuffer.getChannelData(0);
      const step = Math.max(1, Math.floor(ch.length / numSamples));
      const wf = [];
      for (let i = 0; i < numSamples; i++) {
        let sum = 0;
        const start = i * step;
        const end = Math.min(start + step, ch.length);
        const count = end - start || 1;
        for (let j = start; j < end; j++) sum += Math.abs(ch[j]);
        wf.push(Math.min(1, (sum / count) * 3));
      }

    }    const useStore = create((set, get) => {

          const state = get();
          if (state.isLoading || !state.input.trim()) return;

          if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
          if (audioEl) { audioEl.pause(); audioEl = null; }

          set({ isLoading: true, error: null, audioUrl: null, waveformData: null, duration: 0, currentTime: 0, isPlaying: false, playProgress: 0, contentType: null, lastCurl: null, isDecoding: false });

                    const body = { model: state.model, input: state.input, voice: state.voice, response_format: state.responseFormat, speed: state.speed };

          // Add instructions if set
          if (state.instructions.trim()) {
            body.instructions = state.instructions.trim();
          }

          // Merge extra JSON params
          if (state.extraJson.trim()) {
            try {
              const parsed = JSON.parse(state.extraJson);
              Object.assign(body, parsed);
            } catch {
              // Invalid JSON is silently ignored
            }
          }

          const base = state.baseUrl.replace(/\/+$/, "");
          const url = `${base}/v1/audio/speech`;
          const h = [`-H "Content-Type: application/json"`];

          set({ lastCurl: curlCmd });

          try {
            const headers = { "Content-Type": "application/json" };

            const response = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
            const contentType = response.headers.get("Content-Type") || "";

            if (!response.ok) {
              let msg = `HTTP ${response.status}`;
              try {
                const ed = await response.json();
                msg = ed.error?.message || ed.message || msg;
              } catch {
                const txt = await response.text();
                if (txt) msg = txt;

              set({ error: msg, isLoading: false }); return;
            }

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            set({ isDecoding: true, contentType });

            try {
              const arrayBuffer = await blob.arrayBuffer();

              const duration = audioBuffer.duration;
              const gen = { id: Date.now(), model: state.model, voice: state.voice || "-", input: state.input, audioUrl, waveformData, duration, contentType, createdAt: new Date().toISOString() };
              set((s) => ({ audioUrl, waveformData, duration, isDecoding: false, isLoading: false, isPlaying: false, currentTime: 0, playProgress: 0, generations: [gen, ...s.generations].slice(0, MAX_HISTORY) }));

            } catch {

              if (get().autoplay) get().play();

}function WaveformCanvas({ waveformData, duration, currentTime, isPlaying, onSeek }) {

        for (let i = 0; i < numBars; i++) {

          const centerFactor = 1 - Math.abs(i / numBars - 0.5) * 2;

          const y = centerY - barHeight / 2;

              const ctEl = containerRef.current;
              if (cvs && ctEl) {
                const rect = ctEl.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height || 140;
                const ctx = cvs.getContext("2d");
                const dpr = window.devicePixelRatio || 1;
                cvs.width = w * dpr;
                cvs.height = h * dpr;
                ctx.scale(dpr, dpr);
                draw(ctx, w, h);
              }
              animRef.current = requestAnimationFrame(loop);
            }
          };
          animRef.current = requestAnimationFrame(loop);
        }

        return () => {
          mounted = false;
          window.removeEventListener("resize", resize);
          if (animRef.current) cancelAnimationFrame(animRef.current);
        };
      }, [waveformData, currentTime, duration, isPlaying]);

      const handleClick = React.useCallback((e) => {
        if (!containerRef.current || !duration || duration <= 0) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        onSeek(Math.max(0, Math.min(1, x / rect.width)));
      }, [duration, onSeek]);

      return (
        <div ref={containerRef} class="waveform-container" onClick={handleClick} style={{ cursor: duration > 0 ? "pointer" : "default" }}>
          <canvas ref={canvasRef} style={{ height: "140px", display: "block" }} />
        </div>
      );
    }    function PlayerControls() {
      const { audioUrl, duration, currentTime, isPlaying, isLoading, isDecoding, model, voice, speed, responseFormat, togglePlay, clearResult } = useStore();
      const canPlay = audioUrl && !isLoading && !isDecoding;
      return (
        <div class="flex flex-col items-center gap-3">
          <div class="flex items-center gap-4">
            <button class="play-btn" onClick={togglePlay} disabled={!canPlay} style={{ opacity: canPlay ? 1 : 0.3, cursor: canPlay ? "pointer" : "not-allowed" }}>
              {isPlaying ? (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              ) : (
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              )}
            </button>
            <button class="icon-btn" onClick={() => { if (audioUrl) downloadBlob(audioUrl, `tts-${model}-${Date.now()}.${responseFormat === "opus" ? "ogg" : responseFormat}`); }} disabled={!audioUrl} style={{ opacity: audioUrl ? 1 : 0.3 }}>

            </button>
            <button class="icon-btn" onClick={clearResult}>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="meta-text flex items-center gap-1.5 flex-wrap justify-center">
            <span class="font-medium text-white/80">{model}</span>
            <span class="text-white/30">·</span>
            <span>{duration ? formatDuration(duration) : "—:——"}</span>
            <span class="text-white/30">·</span>
            <span>{voice || "—"}</span>
            <span class="text-white/30">·</span>
            <span>{speed.toFixed(2)}x</span>
            <span class="text-white/30">·</span>
            <span class="uppercase">{responseFormat}</span>
          </div>
          {(isLoading || isDecoding) && (
            <div class="flex items-center gap-2 text-xs text-[#9ca3af]">
              <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
              {isDecoding ? "Decoding audio…" : "Generating…"}
            </div>
          )}
        </div>
      );
    }

    function InputForm() {
      const { model, voice, speed, responseFormat, input, availableModels, isLoading, setModel, setVoice, setSpeed, setResponseFormat, setInput, submit } = useStore();
      const inputLen = input.length;
      const currentModel = availableModels.find((m) => m.id === model);
      const voices = currentModel?.supported_voices ?? [];

      return (
        <div class="card-tts p-4 space-y-3">
          <textarea value={input} onChange={(e) => setInput(e.target.value)} placeholder="TestingCatalog rocks..." rows={3} class="input-area" />
          {inputLen > 0 && (
            <div class="flex justify-end -mt-2">
              <span class={`text-[11px] font-mono tabular-nums ${inputLen > INPUT_MAX_LENGTH * 0.9 ? "text-red-400 font-semibold" : "text-[#9ca3af]"}`}>{inputLen}/{INPUT_MAX_LENGTH}</span>
            </div>
          )}
          <div class="flex flex-wrap items-center gap-2">
            <div class="param-chip">
              <span class="label">🎤</span>
              <select value={model} onChange={(e) => setModel(e.target.value)}>
                {availableModels.length > 0 ? availableModels.map((m) => <option key={m.id} value={m.id}>{m.id}</option>) : <><option value="tts-1">tts-1</option><option value="google-translate">google-translate</option></>}
              </select>
            </div>
            <div class="param-chip">
              <span class="label">🗣</span>
              <select value={voice} onChange={(e) => setVoice(e.target.value)}>
                {voices.length > 0 ? voices.map((v) => <option key={v} value={v}>{v}</option>) : <><option value="">Default</option><option value="alloy">alloy</option><option value="echo">echo</option><option value="fable">fable</option><option value="onyx">onyx</option><option value="nova">nova</option><option value="shimmer">shimmer</option></>}
              </select>
            </div>
            <div class="param-chip">
              <span class="label">Speed</span>
              <select value={speed} onChange={(e) => setSpeed(parseFloat(e.target.value))}>
                {[0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0, 3.5, 4.0].map((s) => <option key={s} value={s}>{s}x</option>)}
              </select>
            </div>
            <div class="param-chip">
              <span class="label">Format</span>
              <select value={responseFormat} onChange={(e) => setResponseFormat(e.target.value)}>
                {RESPONSE_FORMATS.map((f) => <option key={f.value} value={f.value}>{f.label}</option>)}
              </select>
            </div>
          </div>
          <div class="flex items-center justify-between pt-1">
            <button onClick={submit} disabled={isLoading || !input.trim()} class="btn-generate">
              {isLoading ? (
                <><svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Generating</>
              ) : (
                <><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Generate</>
              )}
            </button>
            <kbd class="hidden sm:inline-flex items-center gap-1 px-2 py-1 text-[11px] text-[#9ca3af] bg-[#1f2937] border border-[#374151] rounded"><span>⌘</span><span>↵</span></kbd>
          </div>
        </div>
      );
    }    function HistoryPanel() {
      const { generations, autoplay, audioUrl, toggleAutoplay, loadGeneration } = useStore();
      return (
        <div class="w-[280px] shrink-0 border-l border-[#374151] flex flex-col bg-[#0f0f0f] overflow-y-auto scroll-thin">
          <div class="flex items-center justify-between px-4 py-3 border-b border-[#374151]">
            <h2 class="text-sm font-semibold text-[#9ca3af]">Generations</h2>
            <div class="flex items-center gap-2">
              <span class="text-[11px] text-[#6b7280]">Autoplay</span>
              <div class={`toggle-track ${autoplay ? "active" : ""}`} onClick={toggleAutoplay}><div class="thumb" /></div>
            </div>
          </div>
          <div class="flex-1 py-2 space-y-0.5">
            {generations.length === 0 ? (
              <div class="px-4 py-8 text-center text-xs text-[#6b7280]">No generations yet.<br />Configure and click Generate.</div>
            ) : generations.map((gen) => (
              <div key={gen.id} class={`history-item ${audioUrl === gen.audioUrl ? "active" : ""}`} onClick={() => loadGeneration(gen)}>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-[#374151]/50 text-[#9ca3af]">{gen.voice || gen.model}</span>
                  <span class="text-[10px] text-[#6b7280]">{gen.duration ? formatDuration(gen.duration) : "—:——"}</span>
                </div>
                <p class="text-xs text-[#9ca3af] leading-relaxed">{truncate(gen.input, 60)}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TopNav() {
  const { toggleHistory } = useStore();
  return (
    <header class="h-[56px] shrink-0 bg-[#1a1a1a] border-b border-[#374151] flex items-center px-4 gap-3">
      <div class="flex items-center gap-2 flex-shrink-0">
        <div class="w-7 h-7 rounded-lg bg-[#10b981]/20 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </div>
        <span class="text-sm font-bold text-white">TTS Playground</span>
      </div>
      <div class="hidden md:flex items-center gap-1 ml-6">
        <a class="nav-link text-xs !text-white/80 !font-semibold">Playground</a>
        <a class="nav-link text-xs">Docs</a>
        <a class="nav-link text-xs">API Reference</a>
      </div>
      <div class="flex items-center gap-1 ml-auto">
        <button onClick={toggleHistory} class="icon-btn" title="Toggle history">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
        <button class="icon-btn" title="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
  );
}function ErrorToast() {
      const { error, clearResult } = useStore();
      if (!error) return null;
      React.useEffect(() => {
        if (error) { const t = setTimeout(() => useStore.setState({ error: null }), 6000); return () => clearTimeout(t); }
      }, [error]);
      return (
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50" style={{ animation: "fadeIn 0.2s ease-out" }}>
          <div class="flex items-center gap-3 px-4 py-3 rounded-lg bg-red-900/90 border border-red-700/50 text-red-200 text-xs shadow-xl backdrop-blur-sm max-w-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            <span class="flex-1">{error}</span>
            <button onClick={clearResult} class="text-red-300 hover:text-red-100 shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <style>{`@keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }`}</style>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("Playground crashed:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return React.createElement("div", {
            style: {
              height: "100vh", display: "flex", alignItems: "center",
              justifyContent: "center", flexDirection: "column",
              background: "#0f0f0f", color: "#e5e7eb", padding: "24px",
              textAlign: "center",
            }
          },
            React.createElement("div", { style: { fontSize: "32px", marginBottom: "12px" } }, "\u26A0"),
            React.createElement("h2", { style: { fontSize: "18px", fontWeight: 600, marginBottom: "8px" } }, "Something went wrong"),
            React.createElement("p", { style: { fontSize: "13px", color: "#9ca3af", marginBottom: "8px", maxWidth: "400px" } },
              this.state.error?.message || "An unexpected error occurred."
            ),
            React.createElement("button", {
              onClick: () => { this.setState({ hasError: false, error: null }); window.location.reload(); },
              style: {
                marginTop: "16px", padding: "8px 20px", background: "#10b981",
                color: "white", border: "none", borderRadius: "6px",
                fontSize: "14px", fontWeight: 600, cursor: "pointer",
              }
            }, "Reload")
          );
        }
        return this.props.children;
      }
    }

    function App() { const { showHistory, fetchModels, audioUrl, duration, currentTime, isPlaying, waveformData, seek, isDecoding, isLoading } = useStore();

      React.useEffect(() => { fetchModels(); }, []);

      return (
        <ErrorBoundary>
        <div class="h-screen flex flex-col bg-[#0f0f0f]">
          <TopNav />
          <div class="flex flex-1 overflow-hidden">
            <Sidebar />
            <div class="flex-1 flex flex-col overflow-hidden">
              <div class="flex-1 overflow-y-auto scroll-thin">
                <div class="max-w-[800px] mx-auto px-6 pt-8 pb-4 space-y-4">
                  <div class="relative">
                    {(isLoading || isDecoding) && !audioUrl && (
                      <div class="waveform-container h-[140px] flex items-center justify-center">
                        <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                      </div>
                    )}
                    <WaveformCanvas waveformData={waveformData} duration={duration} currentTime={currentTime} isPlaying={isPlaying} onSeek={seek} />
                  </div>
                  <PlayerControls />
                </div>
              </div>
              <div class="shrink-0 px-6 pb-4 max-w-[800px] mx-auto w-full">
                <InputForm />
              </div>
            </div>
            {showHistory && <HistoryPanel />}
          </div>
          <ErrorToast />
        </div>
        </ErrorBoundary>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
